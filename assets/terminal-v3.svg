
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="590" viewBox="0 0 800 590"
     role="img" aria-label="Sudi terminal profile">

  <defs>
    <!-- Soft window shadow -->
    <filter id="window-shadow"
            x="-15%" y="-15%"
            width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha"
                      stdDeviation="9"
                      result="blur"/>
      <feOffset in="blur"
                dx="0" dy="9"
                result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur"
                           result="shadow">
        <feFuncA type="linear" slope="0.48"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle terminal gradient -->
    <linearGradient id="terminal-bg"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#182332"/>
      <stop offset="100%" stop-color="#131c29"/>
    </linearGradient>

    <linearGradient id="title-bg"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop offset="0%" stop-color="#303d4d"/>
      <stop offset="100%" stop-color="#263343"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular,
                   Consolas, 'Liberation Mono', monospace;
      font-size: 15px;
      font-variant-ligatures: none;
    }

    .muted  { fill: #a6b7ca; }
    .prompt { fill: #72e0ac; }
    .cyan   { fill: #80d2ff; }
    .white  { fill: #f0f5fc; }

    .line, .typed, .typing-cursor {
      opacity: 0;
    }

    .line { animation: appear .18s ease-out forwards; }
    .l2  { animation-delay: 1.65s; }
    .l3  { animation-delay: 1.88s; }
    .l4  { animation-delay: 2.11s; }
    .l6  { animation-delay: 4.25s; }
    .l7  { animation-delay: 4.48s; }
    .l8  { animation-delay: 4.75s; }
    .l9  { animation-delay: 4.98s; }
    .l11 { animation-delay: 7.05s; }
    .l13 { animation-delay: 9.08s; }
    .l14 { animation-delay: 9.31s; }
    .l15 { animation-delay: 9.54s; }
    .l16 { animation-delay: 9.77s; }

    .prompt-prefix { animation: appear .01s linear forwards; }
    .p1 { animation-delay: .35s; }
    .p2 { animation-delay: 2.55s; }
    .p3 { animation-delay: 5.38s; }
    .p4 { animation-delay: 7.42s; }
    .p5 { animation-delay: 10.12s; }

    /* Each command is one text node. Clipping it keeps every glyph on the same grid. */
    .typed { animation: appear .01s linear forwards; }
    .type-1 { animation-delay: .55s; clip-path: url(#clip-whoami); }
    .type-2 { animation-delay: 2.75s; clip-path: url(#clip-currently); }
    .type-3 { animation-delay: 5.58s; clip-path: url(#clip-interests); }
    .type-4 { animation-delay: 7.62s; clip-path: url(#clip-contacts); }

    .clip-1 { animation: reveal-6 .72s .55s steps(6, end) forwards; }
    .clip-2 { animation: reveal-17 1.18s 2.75s steps(17, end) forwards; }
    .clip-3 { animation: reveal-17 1.18s 5.58s steps(17, end) forwards; }
    .clip-4 { animation: reveal-16 1.12s 7.62s steps(16, end) forwards; }

    .typing-cursor { transform-box: fill-box; transform-origin: left center; }
    .c1 { animation: cursor-6 .72s .55s steps(6, end) forwards; }
    .c2 { animation: cursor-17 1.18s 2.75s steps(17, end) forwards; }
    .c3 { animation: cursor-17 1.18s 5.58s steps(17, end) forwards; }
    .c4 { animation: cursor-16 1.12s 7.62s steps(16, end) forwards; }

    .cursor {
      opacity: 0;
      animation: appear .01s 10.32s forwards,
                 blink 1s 10.32s steps(1, end) infinite;
    }

    @keyframes appear {
      to { opacity: 1; }
    }

    @keyframes reveal-6  { to { width: 54.2px; } }
    @keyframes reveal-17 { to { width: 153.5px; } }
    @keyframes reveal-16 { to { width: 144.5px; } }
    @keyframes cursor-6  { 0% { opacity: 1; } 99% { opacity: 1; transform: translateX(54.2px); } 100% { opacity: 0; transform: translateX(54.2px); } }
    @keyframes cursor-17 { 0% { opacity: 1; } 99% { opacity: 1; transform: translateX(153.5px); } 100% { opacity: 0; transform: translateX(153.5px); } }
    @keyframes cursor-16 { 0% { opacity: 1; } 99% { opacity: 1; transform: translateX(144.5px); } 100% { opacity: 0; transform: translateX(144.5px); } }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <clipPath id="clip-whoami"><rect class="clip-1" x="158.4" y="62" width="0" height="21"/></clipPath>
  <clipPath id="clip-currently"><rect class="clip-2" x="158.4" y="183" width="0" height="21"/></clipPath>
  <clipPath id="clip-interests"><rect class="clip-3" x="158.4" y="321" width="0" height="21"/></clipPath>
  <clipPath id="clip-contacts"><rect class="clip-4" x="158.4" y="383" width="0" height="21"/></clipPath>

  <!-- Terminal window with padding for shadow -->
  <g transform="translate(20, 14)">

    <!-- Window shadow -->
    <rect x="0" y="0"
          width="760" height="540"
          rx="14"
          fill="#000000"
          filter="url(#window-shadow)"/>

    <!-- Terminal background -->
    <rect width="760" height="540"
          rx="14"
          fill="url(#terminal-bg)"/>

    <!-- Terminal border -->
    <rect x="0.75" y="0.75"
          width="758.5" height="538.5"
          rx="13.25"
          fill="none"
          stroke="#40556d"
          stroke-width="1.5"/>

    <!-- Title bar -->
    <path d="M14 0H746Q760 0 760 14V45H0V14Q0 0 14 0Z"
          fill="url(#title-bg)"/>

    <!-- Title bar divider -->
    <line x1="1" y1="45"
          x2="759" y2="45"
          stroke="#43566b"
          stroke-width="1"/>

    <!-- Window controls -->
    <circle cx="23" cy="23" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="23" r="6" fill="#febc2e"/>
    <circle cx="65" cy="23" r="6" fill="#28c840"/>

    <!-- Title -->
    <text x="380" y="28"
          text-anchor="middle"
          class="mono muted"
          font-size="13">
      sudi@github: ~
    </text>

    <g class="mono">

      <!-- Whoami -->
      <text x="26" y="78" class="prompt line prompt-prefix p1">sudi@github:~$ </text>
      <text x="158.4" y="78" class="white typed type-1">whoami</text>
      <rect x="158.4" y="64" width="9" height="18" class="white typing-cursor c1"/>

      <text x="26" y="111"
            class="white line l2"
            font-size="23"
            font-weight="bold">
        hey, i'm sudi.
      </text>

      <text x="26" y="138" class="muted line l3">
        software developer · computer science @ ubc
      </text>

      <text x="26" y="163" class="muted line l4">
        i like building stuff.
      </text>

      <!-- Currently -->
      <text x="26" y="199" class="prompt line prompt-prefix p2">sudi@github:~$ </text>
      <text x="158.4" y="199" class="white typed type-2">cat currently.txt</text>
      <rect x="158.4" y="185" width="9" height="18" class="white typing-cursor c2"/>

      <!-- Project 1 -->
      <text x="26" y="233" class="muted line l6">
        [1/2]
      </text>

      <text x="91" y="233" class="cyan line l6">
        podlet.dev
      </text>

      <text x="91" y="253"
            class="muted line l7"
            font-size="13">
        your server. your deployments.
      </text>

      <!-- Project 2 -->
      <text x="26" y="280" class="muted line l8">
        [2/2]
      </text>

      <text x="91" y="280" class="cyan line l8">
        app.ubcesports.ca
      </text>

      <text x="91" y="300"
            class="muted line l9"
            font-size="13">
        making campus esports a little easier to run.
      </text>

      <!-- Interests -->
      <text x="26" y="337" class="prompt line prompt-prefix p3">sudi@github:~$ </text>
      <text x="158.4" y="337" class="white typed type-3">cat interests.txt</text>
      <rect x="158.4" y="323" width="9" height="18" class="white typing-cursor c3"/>

      <text x="26" y="363" class="muted line l11">
        cloud infrastructure, game dev, and a lil valorant
      </text>

      <!-- Contacts -->
      <text x="26" y="399" class="prompt line prompt-prefix p4">sudi@github:~$ </text>
      <text x="158.4" y="399" class="white typed type-4">cat contacts.txt</text>
      <rect x="158.4" y="385" width="9" height="18" class="white typing-cursor c4"/>

      <text x="26" y="425" class="muted line l13">
        email
      </text>
      <text x="145" y="425" class="cyan line l13">
        sudipto.islam2005@gmail.com
      </text>

      <text x="26" y="449" class="muted line l14">
        instagram
      </text>
      <text x="145" y="449" class="cyan line l14">
        @mrmangoseed
      </text>

      <text x="26" y="473" class="muted line l15">
        linkedin
      </text>
      <text x="145" y="473" class="cyan line l15">
        linkedin.com/in/sudipto-islam/
      </text>

      <text x="26" y="497" class="muted line l16">
        youtube
      </text>
      <text x="145" y="497" class="cyan line l16">
        @MangoDev
      </text>

      <!-- Final prompt -->
      <text x="26" y="528" class="prompt line prompt-prefix p5">sudi@github:~$ </text>

      <!-- Blinking cursor -->
      <rect x="158.4" y="514"
            width="9" height="18"
            fill="#e5edf6"
            class="cursor"/>

    </g>
  </g>
</svg>
